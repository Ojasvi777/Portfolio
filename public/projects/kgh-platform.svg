<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191b" />
      <stop offset="50%" stop-color="#131314" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Dotted grid -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3c4043" opacity="0.4" />
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Ambient glow orb -->
  <circle cx="400" cy="250" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Browser/Window Mockup Container -->
  <rect x="50" y="40" width="700" height="520" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-width="2" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#282a2c" />
  <rect x="50" y="70" width="700" height="12" fill="#282a2c" />
  <circle cx="75" cy="61" r="5" fill="#ea4335" />
  <circle cx="95" cy="61" r="5" fill="#fbbc05" />
  <circle cx="115" cy="61" r="5" fill="#34a853" />

  <!-- Address Pill -->
  <rect x="220" y="49" width="360" height="24" rx="12" fill="#18191b" stroke="#3c4043" stroke-width="1" />
  <text x="400" y="65" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    kathuriagunhouse.app/workspace
  </text>

  <!-- Visual content inside mockup -->
  <g transform="translate(70, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#18191b" stroke="#10b981" stroke-width="1" />
    <text x="80" y="17" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      STAGE: LIVE (500+ USERS)
    </text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">
      Kathuria Gun House
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="13">
      Custom E-Commerce & Appointment Platform (buyairgunsindia.in)
    </text>

    <!-- Inner UI Graphic elements -->
    
  <g transform="translate(0, 110)">
    <!-- Store Header -->
    <rect x="0" y="0" width="660" height="50" rx="8" fill="#18191b" stroke="#3c4043" />
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">Kathuria Gun House · Storefront</text>
    <rect x="470" y="12" width="170" height="26" rx="6" fill="#047857" />
    <text x="555" y="29" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LIVE: buyairgunsindia.in</text>

    <!-- Product Grid -->
    <rect x="0" y="65" width="205" height="215" rx="8" fill="#18191b" stroke="#3c4043" />
    <rect x="15" y="80" width="175" height="100" rx="6" fill="#282a2c" />
    <text x="15" y="200" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Precision Sporting Rifle</text>
    <text x="15" y="220" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">₹4,999</text>
    <text x="15" y="240" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="10">Verified Buyer Reviews Only</text>
    <rect x="15" y="250" width="175" height="20" rx="4" fill="#2563eb" />
    <text x="102" y="264" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Book Consultation</text>

    <rect x="225" y="65" width="205" height="215" rx="8" fill="#18191b" stroke="#3c4043" />
    <rect x="240" y="80" width="175" height="100" rx="6" fill="#282a2c" />
    <text x="240" y="200" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">Air Pistol Match Pro</text>
    <text x="240" y="220" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">₹6,450</text>
    <text x="240" y="240" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="10">AWS + Next.js + Prisma</text>
    <rect x="240" y="250" width="175" height="20" rx="4" fill="#2563eb" />
    <text x="327" y="264" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Book Consultation</text>

    <!-- Appointment Fee Highlight Callout -->
    <rect x="450" y="65" width="210" height="215" rx="8" fill="#141517" stroke="#f59e0b" stroke-width="1.5" />
    <text x="465" y="95" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">PM DECISION IMPACT</text>
    <text x="465" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">₹500 Booking Fee</text>
    <text x="465" y="150" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11">Credited against product purchase.</text>
    <rect x="465" y="175" width="180" height="50" rx="6" fill="#282a2c" />
    <text x="475" y="195" fill="#34d399" font-family="monospace" font-size="10 font-weight=bold">WALK-IN CONSULTATIONS</text>
    <text x="475" y="213" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11">Zero no-purchase drop-offs</text>
    <text x="465" y="245" fill="#60a5fa" font-family="monospace" font-size="10">2 Months Delivery · 500+ Users</text>
  </g>

  </g>
</svg>