<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191b" />
      <stop offset="50%" stop-color="#131314" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Dotted grid -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3c4043" opacity="0.4" />
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Ambient glow orb -->
  <circle cx="400" cy="250" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Browser/Window Mockup Container -->
  <rect x="50" y="40" width="700" height="520" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-width="2" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#282a2c" />
  <rect x="50" y="70" width="700" height="12" fill="#282a2c" />
  <circle cx="75" cy="61" r="5" fill="#ea4335" />
  <circle cx="95" cy="61" r="5" fill="#fbbc05" />
  <circle cx="115" cy="61" r="5" fill="#34a853" />

  <!-- Address Pill -->
  <rect x="220" y="49" width="360" height="24" rx="12" fill="#18191b" stroke="#3c4043" stroke-width="1" />
  <text x="400" y="65" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    googlecalendarforstudentorganizers.app/workspace
  </text>

  <!-- Visual content inside mockup -->
  <g transform="translate(70, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#18191b" stroke="#f59e0b" stroke-width="1" />
    <text x="80" y="17" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      STAGE: IN PROGRESS
    </text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">
      Google Calendar for Student Organizers
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="13">
      Collegiate Event Coordination Teardown & PRD
    </text>

    <!-- Inner UI Graphic elements -->
    
  <g transform="translate(0, 110)">
    <rect x="0" y="0" width="660" height="280" rx="8" fill="#18191b" stroke="#3c4043" />
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">
      Google Calendar for Student Event Organizers · Product Teardown &amp; PRD
    </text>

    <rect x="20" y="55" width="620" height="70" rx="8" fill="#141517" stroke="#f59e0b" />
    <text x="40" y="85" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">STATUS: IN PROGRESS TEARDOWN</text>
    <text x="40" y="108" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">
      Investigating scheduling conflicts, campus venue bottlenecks, and multi-team attendee coordination.
    </text>

    <!-- Schedule Grid -->
    <rect x="20" y="140" width="620" height="120" rx="8" fill="#141517" />
    <text x="40" y="170" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">PRD Scope &amp; User Discovery:</text>
    <text x="40" y="195" fill="#9aa0a6" font-family="monospace" font-size="10">1. Discovery interviews with collegiate student organizers</text>
    <text x="40" y="215" fill="#9aa0a6" font-family="monospace" font-size="10">2. Friction mapping: room booking clashes &amp; crew communication</text>
    <text x="40" y="235" fill="#60a5fa" font-family="monospace" font-size="10">3. PRD specification linking calendar triggers with task assignments</text>
  </g>

  </g>
</svg>