<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191b" />
      <stop offset="50%" stop-color="#131314" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Dotted grid -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3c4043" opacity="0.4" />
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Ambient glow orb -->
  <circle cx="400" cy="250" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Browser/Window Mockup Container -->
  <rect x="50" y="40" width="700" height="520" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-width="2" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#282a2c" />
  <rect x="50" y="70" width="700" height="12" fill="#282a2c" />
  <circle cx="75" cy="61" r="5" fill="#ea4335" />
  <circle cx="95" cy="61" r="5" fill="#fbbc05" />
  <circle cx="115" cy="61" r="5" fill="#34a853" />

  <!-- Address Pill -->
  <rect x="220" y="49" width="360" height="24" rx="12" fill="#18191b" stroke="#3c4043" stroke-width="1" />
  <text x="400" y="65" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    licenseverificationautomation.app/workspace
  </text>

  <!-- Visual content inside mockup -->
  <g transform="translate(70, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#18191b" stroke="#6366f1" stroke-width="1" />
    <text x="80" y="17" fill="#6366f1" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      STAGE: IN USE BY CLIENT
    </text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">
      License Verification Automation
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="13">
      Automated OCR & Government Portal Validation System
    </text>

    <!-- Inner UI Graphic elements -->
    
  <g transform="translate(0, 110)">
    <rect x="0" y="0" width="310" height="280" rx="8" fill="#18191b" stroke="#3c4043" />
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Document Scan OCR Preprocessing</text>
    <rect x="20" y="45" width="270" height="150" rx="6" fill="#141517" stroke="#282a2c" />
    <!-- Bounding boxes -->
    <rect x="40" y="70" width="140" height="24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />
    <text x="45" y="86" fill="#60a5fa" font-family="monospace" font-size="11">LIC-2025-PB-9982</text>
    <rect x="40" y="105" width="180" height="20" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="119" fill="#34d399" font-family="monospace" font-size="10">HOLDER: [CONFIDENTIAL]</text>
    <rect x="40" y="135" width="100" height="20" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="149" fill="#34d399" font-family="monospace" font-size="10">EXP: 2029-12-31</text>
    
    <text x="20" y="225" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11">OpenCV Grayscale + Adaptive Threshold</text>
    <text x="20" y="245" fill="#60a5fa" font-family="monospace" font-size="11">Tesseract OCR + Regex Extraction</text>

    <!-- Verification Outcome Container -->
    <rect x="330" y="0" width="330" height="280" rx="8" fill="#18191b" stroke="#3c4043" />
    <text x="350" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Automated Portal Verification</text>
    
    <rect x="350" y="55" width="290" height="85" rx="6" fill="#064e3b" stroke="#10b981" />
    <text x="370" y="85" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">~80% TOIL REDUCTION</text>
    <text x="370" y="110" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">Replaced manual portal search &amp; Excel entry</text>
    <text x="370" y="128" fill="#a7f3d0" font-family="monospace" font-size="10">Only captcha input stays manual</text>

    <rect x="350" y="155" width="290" height="110" rx="6" fill="#282a2c" />
    <text x="370" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Automated Data Pipeline:</text>
    <text x="370" y="202" fill="#9aa0a6" font-family="monospace" font-size="10">1. OpenCV Ingestion &amp; Skew Correction</text>
    <text x="370" y="222" fill="#9aa0a6" font-family="monospace" font-size="10">2. Regex Serial Parsing (99%+ Precision)</text>
    <text x="370" y="242" fill="#9aa0a6" font-family="monospace" font-size="10">3. SQLite + Power BI Compliance Tracking</text>
  </g>

  </g>
</svg>