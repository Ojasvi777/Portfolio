<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="leadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="50%" stop-color="#180709" />
      <stop offset="100%" stop-color="#0d0405" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#leadBg)" />

  <pattern id="gridL" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#7f1d1d" opacity="0.3" />
  </pattern>
  <rect width="800" height="500" fill="url(#gridL)" />

  <circle cx="400" cy="200" r="160" fill="#dc2626" opacity="0.12" filter="url(#glowGold)" />

  <!-- Frame -->
  <rect x="40" y="30" width="720" height="440" rx="14" fill="#140608" stroke="#450a0a" stroke-width="1.5" />

  <!-- Header -->
  <rect x="40" y="30" width="720" height="40" rx="14" fill="#220b0e" />
  <rect x="40" y="58" width="720" height="12" fill="#220b0e" />
  <circle cx="65" cy="50" r="4.5" fill="#ef4444" />
  <circle cx="82" cy="50" r="4.5" fill="#f59e0b" />
  <circle cx="99" cy="50" r="4.5" fill="#10b981" />

  <rect x="230" y="38" width="340" height="24" rx="12" fill="#0d0405" stroke="#450a0a" stroke-width="1" />
  <text x="400" y="54" fill="#f87171" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    accolades · national-fests · leadership
  </text>

  <g transform="translate(65, 85)">
    <!-- Badge -->
    <rect x="0" y="0" width="210" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="105" y="16" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">
      NATIONAL FESTS &amp; AWARDS
    </text>

    <!-- Title -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">
      Competitive Leadership &amp; Stage Accolades
    </text>
    <text x="0" y="74" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12">
      Represented &amp; Won at Premier Indian Institutions in Acting, Dramatics &amp; Product Hackathons
    </text>

    <!-- 4 Premier Institutes Cards -->
    <g transform="translate(0, 95)">
      <!-- NIT Trichy -->
      <rect x="0" y="0" width="155" height="150" rx="10" fill="#1f090b" stroke="#7f1d1d" stroke-width="1" />
      <circle cx="77" cy="40" r="22" fill="url(#goldGrad)" opacity="0.9" />
      <polygon points="77,26 81,34 90,36 83,42 85,51 77,46 69,51 71,42 64,36 73,34" fill="#1f090b" />
      <text x="77" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NIT Trichy</text>
      <text x="77" y="105" fill="#fde047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WINNER / 1st</text>
      <text x="77" y="125" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Festive Trophy</text>

      <!-- IIT Madras -->
      <rect x="171" y="0" width="155" height="150" rx="10" fill="#1f090b" stroke="#7f1d1d" stroke-width="1" />
      <circle cx="248" cy="40" r="22" fill="#3b82f6" opacity="0.8" />
      <polygon points="248,26 252,34 261,36 254,42 256,51 248,46 240,51 242,42 235,36 244,34" fill="#ffffff" />
      <text x="248" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IIT Madras</text>
      <text x="248" y="105" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PODIUM</text>
      <text x="248" y="125" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">National Cultural</text>

      <!-- IIM Bangalore -->
      <rect x="342" y="0" width="155" height="150" rx="10" fill="#1f090b" stroke="#7f1d1d" stroke-width="1" />
      <circle cx="419" cy="40" r="22" fill="#10b981" opacity="0.8" />
      <polygon points="419,26 423,34 432,36 425,42 427,51 419,46 411,51 413,42 406,36 415,34" fill="#ffffff" />
      <text x="419" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IIM Bangalore</text>
      <text x="419" y="105" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FINALIST</text>
      <text x="419" y="125" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Dramatics &amp; Model</text>

      <!-- IIT Bombay -->
      <rect x="513" y="0" width="155" height="150" rx="10" fill="#1f090b" stroke="#7f1d1d" stroke-width="1" />
      <circle cx="590" cy="40" r="22" fill="#8b5cf6" opacity="0.8" />
      <polygon points="590,26 594,34 603,36 596,42 598,51 590,46 582,51 584,42 577,36 586,34" fill="#ffffff" />
      <text x="590" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">IIT Bombay</text>
      <text x="590" y="105" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">COMPETITOR</text>
      <text x="590" y="125" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Mood Indigo Stage</text>
    </g>

    <!-- Bottom summary row -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="668" height="65" rx="10" fill="#170608" stroke="#3f0d12" />
      <text x="20" y="26" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold">
        DISCIPLINE · PERFORMANCE ARTS &amp; TEAM LEADERSHIP
      </text>
      <text x="20" y="47" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="12">
        Led 5-6 intern engineers on KGH, founded StageConnect, and steered collegiate dramatics &amp; club events.
      </text>
    </g>
  </g>
</svg>
