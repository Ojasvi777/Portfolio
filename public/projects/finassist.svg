<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191b" />
      <stop offset="50%" stop-color="#131314" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Dotted grid -->
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3c4043" opacity="0.4" />
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Ambient glow orb -->
  <circle cx="400" cy="250" r="180" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />

  <!-- Browser/Window Mockup Container -->
  <rect x="50" y="40" width="700" height="520" rx="16" fill="#1e1f20" stroke="#3c4043" stroke-width="2" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#282a2c" />
  <rect x="50" y="70" width="700" height="12" fill="#282a2c" />
  <circle cx="75" cy="61" r="5" fill="#ea4335" />
  <circle cx="95" cy="61" r="5" fill="#fbbc05" />
  <circle cx="115" cy="61" r="5" fill="#34a853" />

  <!-- Address Pill -->
  <rect x="220" y="49" width="360" height="24" rx="12" fill="#18191b" stroke="#3c4043" stroke-width="1" />
  <text x="400" y="65" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
    finassist.app/workspace
  </text>

  <!-- Visual content inside mockup -->
  <g transform="translate(70, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#18191b" stroke="#0ea5e9" stroke-width="1" />
    <text x="80" y="17" fill="#0ea5e9" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      STAGE: DEMO (PRECISION@4: 95%)
    </text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">
      FinAssist
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="13">
      Intelligent Financial Assistant for AMEX Cards (RAG)
    </text>

    <!-- Inner UI Graphic elements -->
    
  <g transform="translate(0, 110)">
    <rect x="0" y="0" width="660" height="280" rx="8" fill="#18191b" stroke="#3c4043" />
    
    <!-- Chat message from user -->
    <rect x="25" y="20" width="460" height="42" rx="12" fill="#282a2c" />
    <text x="45" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">
      "What are the lounge access rules for AmEx Platinum Supplementary card?"
    </text>

    <!-- Bot Response with Citation -->
    <rect x="25" y="75" width="610" height="115" rx="12" fill="#1e1f20" stroke="#3b82f6" />
    <text x="45" y="105" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold">
      FINASSIST RAG ENGINE (CONFIDENCE: 94.8% · SOURCE CITED)
    </text>
    <text x="45" y="130" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">
      Supplementary Cardmembers receive complimentary Centurion Lounge access with up to 2 guests.
    </text>
    <!-- Source chip -->
    <rect x="45" y="145" width="260" height="26" rx="6" fill="#18191b" stroke="#3c4043" />
    <text x="55" y="162" fill="#9aa0a6" font-family="monospace" font-size="10">
      Source: AmEx_Platinum_Cardmember_Guide.pdf#p14
    </text>

    <!-- Benchmarks footer -->
    <rect x="25" y="205" width="180" height="55" rx="6" fill="#141517" stroke="#10b981" />
    <text x="35" y="226" fill="#9aa0a6" font-family="monospace" font-size="9">PRECISION@4</text>
    <text x="35" y="248" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">95% (MEASURED)</text>

    <rect x="220" y="205" width="180" height="55" rx="6" fill="#141517" stroke="#10b981" />
    <text x="230" y="226" fill="#9aa0a6" font-family="monospace" font-size="9">MEAN RECIPROCAL RANK</text>
    <text x="230" y="248" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">MRR 1.0 (MEASURED)</text>

    <rect x="415" y="205" width="220" height="55" rx="6" fill="#141517" stroke="#f59e0b" />
    <text x="425" y="226" fill="#9aa0a6" font-family="monospace" font-size="9">TRADE-OFF: TRUST OVER SPEED</text>
    <text x="425" y="248" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">~200ms Confidence Filter</text>
  </g>

  </g>
</svg>